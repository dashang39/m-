<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: http: https:; media-src 'self' blob: http: https:; script-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https:; font-src 'self' data:;" />
<title>M记</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="bg-layer" aria-hidden="true"></div>
<div class="bg-veil" aria-hidden="true"></div>
<div id="app">
  <nav id="rail">
    <div class="logo" title="M记">
      <span>M</span>
      <i class="logo-note">♪</i>
    </div>
    <button class="rail-btn active" data-nav="home" title="首页">
      <img class="leek-icon" src="assets/leek.png" alt="首页" />
      <span class="rail-label">首页</span>
    </button>
    <button class="rail-btn" data-nav="schedule" title="新番周表">
      <!-- 日历（手绘涂鸦） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.6 5.9c4.3-.2 8.6-.2 12.9 0 .2 4.3.2 8.6 0 12.9-4.3.2-8.6.2-12.9 0-.2-4.3-.2-8.6 0-12.9z"/>
        <path d="M5.8 9.6c4.2-.2 8.4-.2 12.6 0"/>
        <path d="M8.7 3.6v2.2M15.4 3.6v2.2"/>
        <circle cx="9.5" cy="13.5" r=".95" fill="currentColor" stroke="none"/>
        <circle cx="12.2" cy="13.5" r=".95" fill="currentColor" stroke="none"/>
      </svg>
      <span class="rail-label">周表</span>
    </button>
    <button class="rail-btn" data-nav="discover" title="发现 · 标签检索">
      <!-- 标签（手绘涂鸦） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.6 10.9c.2-3.4.5-5.1 1.5-6.1s2.7-1.3 6.1-1.5c1.1 0 2.2.8 3.3 1.9s1.9 2.2 1.9 3.3c-.2 3.4-.5 5.1-1.5 6.1s-2.7 1.3-6.1 1.5c-1.1 0-2.2-.8-3.3-1.9s-1.9-2.2-1.9-3.3z"/>
        <circle cx="9.2" cy="9.2" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <span class="rail-label">发现</span>
    </button>
    <button class="rail-btn" data-nav="fav" title="收藏">
      <!-- 爱心（手绘涂鸦） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.1 20.2c-.6-.3-8.4-5.2-8.7-9.6-.2-2.6 1.9-4.8 4.4-4.8 1.9 0 3.2 1.1 4.2 2.4 1-1.3 2.4-2.5 4.3-2.4 2.5.1 4.5 2.3 4.2 4.9-.4 4.4-8.1 9.3-8.4 9.5z"/>
        <path d="M8.4 9.9c.3-.7.9-1.2 1.6-1.3" opacity=".7"/>
      </svg>
      <span class="rail-label">收藏</span>
    </button>
    <button class="rail-btn" data-nav="history" title="观看历史">
      <!-- 时钟（手绘涂鸦） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.4 3.9c4.4-.1 8 3.4 8.1 7.8.1 4.4-3.4 8-7.8 8.1-4.4.1-8-3.4-8.1-7.8-.1-4.4 3.4-8 7.8-8.1"/>
        <path d="M12.1 7.5c.1 1.6.1 3.1.1 4.6"/>
        <path d="M12.3 12.1c1.1.7 2.2 1.3 3.2 2"/>
      </svg>
      <span class="rail-label">历史</span>
    </button>
    <div class="spacer"></div>
    <button class="rail-btn" id="settingsBtn" title="设置">
      <!-- 齿轮（手绘涂鸦） -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.1 8.2c2.1 0 3.8 1.8 3.8 3.9s-1.7 3.8-3.9 3.8-3.8-1.7-3.8-3.9 1.8-3.8 3.9-3.8z"/>
        <path d="M11.9 3.3c.1.9.1 1.7.1 2.6M12.1 18.2c0 .9 0 1.8.1 2.6M3.3 12.1c.8 0 1.6 0 2.5-.1M18.2 12c.9 0 1.8 0 2.6-.1"/>
        <path d="M6 5.9c.6.6 1.2 1.2 1.8 1.9M16.2 16.3c.6.6 1.2 1.2 1.8 1.8M17.9 6c-.6.6-1.2 1.2-1.8 1.9M7.9 16.2c-.6.6-1.2 1.2-1.8 1.8"/>
      </svg>
      <span class="rail-label">设置</span>
    </button>
  </nav>

  <div id="main">
    <header id="topbar">
      <button id="topBack" class="top-back hidden" title="返回">‹</button>
      <div id="titleBar">首页</div>
      <div class="search-box">
        <input id="q" type="text" placeholder="搜索番剧…" autocomplete="off" spellcheck="false" />
        <button id="goSearch" title="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <button id="refreshBtn" class="top-btn" title="刷新当前页面">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="themeBtn" class="top-btn" title="切换日间 / 夜间模式">
        <svg class="ic-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 2.6v2.4M12 19v2.4M2.6 12h2.4M19 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/>
          </g>
        </svg>
        <svg class="ic-moon" viewBox="0 0 24 24">
          <path d="M20.6 14.4A8.6 8.6 0 0 1 9.6 3.4a8.6 8.6 0 1 0 11 11z" fill="currentColor"/>
        </svg>
      </button>
      <div class="win-controls">
        <button id="winMin" class="wbtn" title="最小化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.6 12.4h10.8"/></svg>
        </button>
        <button id="winMax" class="wbtn" title="最大化">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 7.6c3.2-.2 6.4-.2 9.6 0 .2 3.1.2 6.2 0 9.3-3.2.2-6.4.2-9.6 0-.2-3.1-.2-6.2 0-9.3z"/></svg>
        </button>
        <button id="winClose" class="wbtn close" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M7.6 7.4c2.9 3 5.9 6 8.8 9M16.4 7.4c-2.9 3-5.9 6-8.8 9"/></svg>
        </button>
      </div>
    </header>
    <div id="view"></div>
  </div>
</div>

<!-- 播放器 -->
<div id="player" class="hidden">
  <div id="playerStage">
  <video id="video" playsinline></video>
  <button id="pBack" class="pbtn pfloat pfloat-left" title="返回详情 (Esc)">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <div id="playerOsd" class="hidden"></div>
  <div id="playerTop">
    <div id="pTitle"></div>
    <div style="flex:1"></div>
  </div>
  <div id="playerBottom">
    <div class="progress-wrap">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
    </div>
    <div class="pb-row">
      <span id="pTime">0:00 / 0:00</span>
      <div class="pb-center">
        <button id="pPrev" class="pbtn" title="上一集 (P)">
          <svg viewBox="0 0 24 24"><path d="M18 5l-8 7 8 7z" fill="currentColor"/><path d="M6 5v14" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="pRew" class="pbtn" title="快退 10 秒 (←)">
          <svg viewBox="0 0 24 24"><path d="M11 5L4 12l7 7z" fill="currentColor"/><path d="M20 5l-7 7 7 7z" fill="currentColor"/></svg>
        </button>
        <button id="pPlay" class="pbtn pbtn-main" title="播放 / 暂停 (空格)">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
        <button id="pFwd" class="pbtn" title="快进 10 秒 (→)">
          <svg viewBox="0 0 24 24"><path d="M13 5l7 7-7 7z" fill="currentColor"/><path d="M4 5l7 7-7 7z" fill="currentColor"/></svg>
        </button>
        <button id="pNext" class="pbtn" title="下一集 (N)">
          <svg viewBox="0 0 24 24"><path d="M6 5l8 7-8 7z" fill="currentColor"/><path d="M18 5v14" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
      <div class="pb-right">
        <select id="pRate" class="pselect" title="倍速">
          <option value="0.75">0.75x</option><option value="1" selected>1x</option>
          <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
        <button id="pEpisodes" class="pbtn" title="选集">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="pMute" class="pbtn" title="静音">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="pPageFull" class="pbtn" title="页面全屏（铺满内容区）">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="pFull" class="pbtn" title="屏幕全屏 (F)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
  </div>
  </div><!-- /playerStage -->
  <div id="playerInfo">
    <div class="pi-poster"><img id="piPoster" alt="" /></div>
    <div class="pi-main">
      <h2 id="piTitle"></h2>
      <div class="pi-sub" id="piSub"></div>
      <p class="pi-desc" id="piDesc"></p>
      <div class="pi-eps-head">选集<span id="piCount"></span></div>
      <div class="pi-eps" id="piEps"></div>
    </div>
  </div>
  <div id="pLoading" class="hidden"><div class="spinner"></div><span id="pLoadingText">获取播放地址…</span></div>
  <div id="pError" class="hidden"></div>
  <div id="epPanel" class="hidden">
    <div class="ep-head"><span>选集</span><button id="epClose">✕</button></div>
    <div id="epList" class="ep-list"></div>
  </div>
</div>

<!-- 设置 -->
<div id="modal" class="hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle">设置</h2><button id="modalClose">✕</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- 验证码 -->
<div id="captchaModal" class="hidden">
  <div class="modal-card captcha-card">
    <div class="modal-head"><h2>人机验证</h2><button id="captchaClose">✕</button></div>
    <div id="captchaBody"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
